name: Build Android

on:
  push:
    branches: [android]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gradle -p android assembleDebug \
            -PversionName="$VERSION" \
            -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Name the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "RoomCraft-NL-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RoomCraft-NL-${{ steps.version.outputs.version }}-android
          path: RoomCraft-NL-${{ steps.version.outputs.version }}-android.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RoomCraft-NL-${{ steps.version.outputs.version }}-android.apk
          generate_release_notes: true
