name: Build Android

on:
  push:
    branches: [android]
  workflow_call:
    inputs:
      version:
        description: 'Versie (leeg = <package.json>-dev.<run_number>)'
        type: string
        required: false
        default: ''
      ref:
        description: 'Commit om te bouwen (leeg = de branch waarop dit draait)'
        type: string
        required: false
        default: ''

concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'android' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$INPUT_VERSION"
          else
            version="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare the release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Alleen een push naar deze branch is een proefbuild. Een release
          # (workflow_call vanuit release-all.yml) moet altijd met de echte
          # releasesleutel worden ondertekend.
          ALLOW_TEMPORARY_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/android' }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/roomcraft-release.keystore"
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            if [[ -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" ]]; then
              echo "ANDROID_KEYSTORE_BASE64 is ingesteld, maar ANDROID_KEYSTORE_PASSWORD of ANDROID_KEY_ALIAS ontbreekt." >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "source=secrets" >> "$GITHUB_OUTPUT"
            echo "::notice::Release-APK ondertekend met de keystore uit de repository-secrets."
          elif [[ "${ALLOW_TEMPORARY_KEY}" == "true" ]]; then
            password="$(openssl rand -hex 24)"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
              -alias roomcraft -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$password" -keypass "$password" \
              -dname "CN=RoomCraft NL, O=RoomCraft NL, C=NL" > /dev/null
            echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=roomcraft" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "source=temporary" >> "$GITHUB_OUTPUT"
            echo "::warning::Geen Android-secrets: deze proefbuild van de android-branch is met een tijdelijke sleutel ondertekend en kan niet in-place worden bijgewerkt. Een release weigert zonder secrets."
          else
            echo "::error::De Android-secrets ontbreken (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Een release-APK moet met de vaste releasesleutel zijn ondertekend, anders kun je hem later niet in-place bijwerken. Zet de secrets (zie README) en start de release opnieuw."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gradle -p android assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Check that the APK is signed with the release key
        env:
          SIGNING_SOURCE: ${{ steps.signing.outputs.source }}
          ALLOW_TEMPORARY_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/android' }}
          # Vingerafdruk van het release-certificaat. Een APK met een andere
          # sleutel kan niet in-place worden bijgewerkt, dus dit is een harde
          # eis. Na het wisselen van de sleutel moet deze waarde mee veranderen.
          EXPECTED_CERT_SHA256: 'B8:17:7B:CA:27:7D:E8:F0:0B:06:19:80:CB:E3:F6:7C:A5:FC:9E:4D:83:2F:D9:C3:74:00:F6:50:72:AD:78:E0'
        run: |
          set -euo pipefail
          if [[ "$SIGNING_SOURCE" != "secrets" && "$ALLOW_TEMPORARY_KEY" != "true" ]]; then
            echo "De APK is niet met de releasesleutel ondertekend; een release mag geen tijdelijke sleutel gebruiken." >&2
            exit 1
          fi
          apk="$(ls android/app/build/outputs/apk/release/app-release*.apk | head -n 1)"
          build_tools="$(ls -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools/* | sort -V | tail -n 1)"
          certs="$("$build_tools/apksigner" verify --print-certs "$apk")"
          echo "$certs"
          if "$build_tools/aapt" dump badging "$apk" | grep -q 'application-debuggable'; then
            echo "De APK is debuggable; dat hoort niet in een release." >&2
            exit 1
          fi
          # Alleen een proefbuild van de branch ondertekent met een tijdelijke
          # sleutel; die heeft per definitie een andere vingerafdruk.
          if [[ "$SIGNING_SOURCE" != "secrets" ]]; then
            echo "::warning::Proefbuild met een tijdelijke sleutel: vingerafdruk niet vergeleken."
            exit 0
          fi
          normalize() { tr 'A-F' 'a-f' | tr -d ':' ; }
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | normalize)"
          actual="$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | normalize)"
          if [[ -z "$actual" ]]; then
            echo "Geen SHA-256-vingerafdruk in de apksigner-uitvoer gevonden." >&2
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::De APK is met een andere sleutel ondertekend dan de releasesleutel. Verwacht $EXPECTED_CERT_SHA256, gevonden $actual. Een APK met een andere sleutel kan niet in-place worden bijgewerkt." >&2
            exit 1
          fi
          echo "::notice::APK-vingerafdruk komt overeen met de releasesleutel ($actual)."

      - name: Name the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="$(ls android/app/build/outputs/apk/release/app-release*.apk | head -n 1)"
          cp "$apk" "RoomCraft-NL-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RoomCraft-NL-${{ steps.version.outputs.version }}-android
          path: RoomCraft-NL-${{ steps.version.outputs.version }}-android.apk
          if-no-files-found: error
