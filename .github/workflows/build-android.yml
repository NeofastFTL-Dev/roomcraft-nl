name: Build Android

on:
  push:
    branches: [android]
  workflow_call:
    inputs:
      version:
        description: 'Versie (leeg = <package.json>-dev.<run_number>)'
        type: string
        required: false
        default: ''
      ref:
        description: 'Commit om te bouwen (leeg = de branch waarop dit draait)'
        type: string
        required: false
        default: ''

concurrency:
  group: build-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'android' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$INPUT_VERSION"
          else
            version="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gradle -p android assembleDebug \
            -PversionName="$VERSION" \
            -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Name the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "RoomCraft-NL-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RoomCraft-NL-${{ steps.version.outputs.version }}-android
          path: RoomCraft-NL-${{ steps.version.outputs.version }}-android.apk
          if-no-files-found: error
