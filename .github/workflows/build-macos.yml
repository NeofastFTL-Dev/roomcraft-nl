name: Build macOS

on:
  push:
    branches: [macos]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stage the desktop runtime
        run: node desktop/prepare-desktop.mjs

      - name: Smoke-test the launcher
        env:
          ROOMCRAFT_DATA: ${{ runner.temp }}/roomcraft-data
        run: ./runtime/node/bin/node desktop/staging/app/desktop/launch.mjs --check

      - name: Build the macOS packages
        run: npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: RoomCraft-NL-${{ steps.version.outputs.version }}-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
