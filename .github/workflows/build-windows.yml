name: Build Windows

on:
  push:
    branches: [windows]
  workflow_call:
    inputs:
      version:
        description: 'Versie (leeg = <package.json>-dev.<run_number>)'
        type: string
        required: false
        default: ''
      ref:
        description: 'Commit om te bouwen (leeg = de branch waarop dit draait)'
        type: string
        required: false
        default: ''

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'windows' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Determine version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $version = "$($package.version)-dev.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "Ongeldige versie: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          npm version $version --no-git-tag-version --allow-same-version | Out-Null

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download Electron runtime
        run: node node_modules/electron/install.js

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://roomcraft:roomcraft@127.0.0.1:5432/roomcraft?schema=public
        run: npx prisma generate

      - name: Build installer
        run: node installer/build-installer.mjs

      - name: Name installer
        id: package
        shell: pwsh
        run: |
          $asset = "RoomCraft-NL-${{ steps.version.outputs.version }}-windows-setup.exe"
          Move-Item "installer/out/RoomCraft NL Setup.exe" "installer/out/$asset"
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: RoomCraft-NL-${{ steps.version.outputs.version }}-windows
          path: installer/out/${{ steps.package.outputs.asset }}
          if-no-files-found: error
