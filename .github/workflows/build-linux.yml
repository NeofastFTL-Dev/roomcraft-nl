name: Build Linux

on:
  push:
    branches: [linux]
  workflow_call:
    inputs:
      version:
        description: 'Versie (leeg = <package.json>-dev.<run_number>)'
        type: string
        required: false
        default: ''
      ref:
        description: 'Commit om te bouwen (leeg = de branch waarop dit draait)'
        type: string
        required: false
        default: ''

concurrency:
  group: build-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'linux' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$INPUT_VERSION"
          else
            version="$(node -p "require('./package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stage the desktop runtime
        run: node desktop/prepare-desktop.mjs

      - name: Smoke-test the launcher
        env:
          ROOMCRAFT_DATA: ${{ runner.temp }}/roomcraft-data
        run: ./runtime/node/bin/node desktop/staging/app/desktop/launch.mjs --check

      - name: Build the Linux packages
        run: npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: RoomCraft-NL-${{ steps.version.outputs.version }}-linux
          path: release/*.AppImage
          if-no-files-found: error
